name: Assemble verified release upload
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft release numeric ID
        required: true
      tag:
        description: Existing version tag
        required: true
      part_count:
        description: Number of installer-block-NNN.part assets
        required: true
      expected_size:
        description: Exact installer bytes
        required: true
      sha256:
        description: Exact installer SHA256
        required: true
permissions:
  contents: write
concurrency:
  group: assemble-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify all parts and upload the complete installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          PART_COUNT: ${{ inputs.part_count }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          rid=os.environ['RELEASE_ID'];tag=os.environ['RELEASE_TAG'];sha=os.environ['EXPECTED_SHA256']
          assert rid.isdigit() and re.fullmatch(r'v\d+\.\d+\.\d+',tag) and re.fullmatch(r'[a-f0-9]{64}',sha)
          count=int(os.environ['PART_COUNT']);size=int(os.environ['EXPECTED_SIZE']);assert 0<count<1000 and 0<size<4*1024**3
          repo=os.environ['GH_REPO'];d=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/{rid}']))
          assert d['tag_name']==tag and d['draft']
          assets={a['name']:a for a in d['assets']};Path('parts').mkdir();full=Path(f'Pi-Agent-Access-{tag[1:]}-macos-arm64.dmg')
          total=hashlib.sha256()
          with full.open('wb') as output:
              for i in range(count):
                  name=f'installer-block-{i:03d}.part';a=assets[name];assert a['state']=='uploaded' and a.get('digest','').startswith('sha256:')
                  p=Path('parts',name)
                  with p.open('wb') as f:subprocess.run(['gh','api',a['url'],'-H','Accept: application/octet-stream','--allow-escape-sequences'],stdout=f,check=True)
                  b=p.read_bytes();assert len(b)==a['size'] and 'sha256:'+hashlib.sha256(b).hexdigest()==a['digest']
                  output.write(b);total.update(b)
          assert full.stat().st_size==size and total.hexdigest()==sha
          subprocess.run(['gh','release','upload',tag,str(full),'--clobber'],check=True)
          PY
