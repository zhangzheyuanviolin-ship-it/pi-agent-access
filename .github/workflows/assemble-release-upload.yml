name: Assemble verified release upload
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft release numeric ID
        required: true
      tag:
        description: Existing version tag
        required: true
      manifest_blob:
        description: Git blob SHA of the verified transfer manifest
        required: true
      expected_size:
        description: Exact installer bytes
        required: true
      sha256:
        description: Exact installer SHA256
        required: true
permissions:
  contents: write
concurrency:
  group: assemble-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify transfer blobs and upload the complete installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          MANIFEST_BLOB: ${{ inputs.manifest_blob }}
          EXPECTED_SIZE: ${{ inputs.expected_size }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,concurrent.futures,hashlib,json,os,re,subprocess
          from pathlib import Path
          rid=os.environ['RELEASE_ID'];tag=os.environ['RELEASE_TAG'];sha=os.environ['EXPECTED_SHA256'];manifest_sha=os.environ['MANIFEST_BLOB']
          assert rid.isdigit() and re.fullmatch(r'v\d+\.\d+\.\d+',tag) and re.fullmatch(r'[a-f0-9]{64}',sha) and re.fullmatch(r'[a-f0-9]{40}',manifest_sha)
          size=int(os.environ['EXPECTED_SIZE']);assert 0<size<4*1024**3
          repo=os.environ['GH_REPO']
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/'+path]))
          def blob(key):
              assert re.fullmatch(r'[a-f0-9]{40}',key)
              d=api('git/blobs/'+key);assert d['encoding']=='base64';b=base64.b64decode(d['content']);assert len(b)==d['size']
              assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==key
              return b
          d=api('releases/'+rid);assert d['tag_name']==tag and d['draft']
          manifest=json.loads(blob(manifest_sha));assert manifest['sha256']==sha and manifest['size']==size and len(manifest['parts'])<1000
          Path('parts').mkdir()
          def fetch(part):
              assert re.fullmatch(r'installer-block-\d{3}\.part',part['name'])
              b=blob(part['blob']);assert len(b)==part['size'] and hashlib.sha256(b).hexdigest()==part['sha256'];Path('parts',part['name']).write_bytes(b)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:list(pool.map(fetch,manifest['parts']))
          full=Path(f'Pi-Agent-Access-{tag[1:]}-macos-arm64.dmg');total=hashlib.sha256()
          with full.open('wb') as output:
              for part in manifest['parts']:
                  b=Path('parts',part['name']).read_bytes();output.write(b);total.update(b)
          assert full.stat().st_size==size and total.hexdigest()==sha
          subprocess.run(['gh','release','upload',tag,str(full),'--clobber'],check=True)
          PY
